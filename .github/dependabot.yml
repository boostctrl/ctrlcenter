# Keep dependencies from drifting: 2.9.0 sat ten weeks behind and missed a
# critical Next.js advisory. Updates target develop (main only moves at
# release time) and go through the same CI gate as any change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Routine bumps in one PR; majors arrive one at a time.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Blocked upstream (#260): eslint-config-next's bundled plugins don't
      # support ESLint 10, and typescript-eslint caps TypeScript below 6.1.
      # Drop these two entries when #260 clears.
      - dependency-name: eslint
        versions: [">=10"]
      - dependency-name: typescript
        versions: [">=7"]
      # The types track the runtime: the image runs Node 24 (Dockerfile),
      # so a newer @types/node would admit APIs the container lacks. Bump
      # by hand alongside the Node major.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Dockerfile pins node:24-alpine by digest; this proposes digest bumps
  # (base-image security fixes) but not a new Node major.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
