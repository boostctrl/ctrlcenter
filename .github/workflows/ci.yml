name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Browser smoke test of the standalone build: renders the key pages in
      # Chromium and signs in through the real form (scripts/smoke.mjs).
      - run: npx playwright-core install --with-deps chromium
      - run: npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: smoke-screenshots/
          if-no-files-found: ignore
