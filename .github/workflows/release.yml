name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/boostctrl/ctrlcenter

jobs:
  # Re-run the quality gate before publishing so a slow multi-arch build can
  # never ship untested code, even if the tag is cut from an un-CI'd commit.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Fail fast if the tag was cut from the wrong commit: the tagged commit
      # must carry the matching version in package.json AND package-lock.json
      # (they drifted in 1.3.0) and a non-empty changelog section (1.2.2 was
      # tagged past its release commit). scripts/release.sh guarantees all of
      # this; the check catches hand-rolled tags.
      - name: Verify tag matches version and changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          if [ "$pkg" != "$version" ]; then
            echo "::error::package.json is $pkg but the tag says $version"
            exit 1
          fi
          if [ "$lock" != "$version" ]; then
            echo "::error::package-lock.json is $lock but the tag says $version"
            exit 1
          fi
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && (/^## / || /^\[[^][]*\]: /) {exit}
            flag {print}
          ' CHANGELOG.md | grep -q '[^[:space:]]' || {
            echo "::error::No CHANGELOG.md section found for $version"
            exit 1
          }

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Build each architecture on its own native runner and push it to GHCR by
  # digest (no tags yet). Native runners skip QEMU entirely — the arm64 image
  # builds on real arm64 hardware instead of a pathologically slow emulated
  # `npm ci` — and both arches build in parallel. `merge` then stitches the
  # per-arch digests into one tagged multi-arch manifest.
  build:
    needs: test
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v5

      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push an untagged, single-platform image and record its digest; the
          # merge job applies the real tags across both arch digests.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Keep each digest a single-platform manifest so imagetools can merge
          # them cleanly (a provenance attestation would wrap it in an index).
          provenance: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into one multi-arch image and apply the release
  # tags: X.Y.Z, X.Y, and (for a non-prerelease tag) latest.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tag derivation as before: vX.Y.Z -> X.Y.Z, X.Y, and latest=auto.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # Publish a GitHub release once the image is up, with notes pulled straight
  # from the matching CHANGELOG.md section so the two never drift.
  publish-release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && (/^## / || /^\[[^][]*\]: /) {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No CHANGELOG.md section found for $version"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag $prerelease
