services:
  ctrlcenter:
    # Pull the published image. To build locally from source instead, comment
    # out `image:` and uncomment `build: .`.
    # Pin a release (e.g. :2.10.0) instead of :latest to upgrade on your terms.
    image: ghcr.io/boostctrl/ctrlcenter:latest
    # build: .
    container_name: ctrlcenter
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Uncomment to allow ICMP "ping" uptime checks (the Ping check type) from
    # inside the container. Without it, ICMP checks just report down; HTTP, TCP,
    # DNS, and keyword checks work regardless.
    # cap_add:
    #   - NET_RAW
    volumes:
      # config.yaml lives here (plus uptime history and uploaded custom icons),
      # written when you save in /admin. The container's entrypoint fixes
      # ownership of this mount on startup, so it works regardless of the host
      # directory's original uid/gid.
      - ./config:/config
    # The image has a built-in healthcheck (GET /api/health).
    # The entrypoint only ever drops privileges (root -> app user), so the
    # container never needs to gain any.
    security_opt:
      - no-new-privileges:true
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Optional: cookie-signing secret. If unset, one is generated on first
      # start and kept in the config volume.
      - SESSION_SECRET=${SESSION_SECRET:-}
