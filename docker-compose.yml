services:
  homepage:
    # Pull the published image. To build locally from source instead, comment
    # out `image:` and uncomment `build: .`.
    image: ghcr.io/boostctrl/homepage-app:latest
    # build: .
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # config.yaml lives here and is written when you save in /admin. The
      # container's entrypoint fixes ownership of this mount on startup, so it
      # works regardless of the host directory's original uid/gid.
      - ./config:/config
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Optional: dedicated cookie-signing secret (falls back to ADMIN_PASSWORD).
      - SESSION_SECRET=${SESSION_SECRET:-}
