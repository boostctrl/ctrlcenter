services:
  homepage:
    # Pull the published image. To build locally from source instead, comment
    # out `image:` and uncomment `build: .`.
    image: ghcr.io/boostctrl/homepage-app:latest
    # build: .
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # The container runs as uid/gid 1001 (the non-root `nextjs` user) and
      # writes config.yaml here when you save in /admin. If this host dir is
      # owned by a different user the writes fail (the UI errors on save), so
      # give 1001 ownership once: `sudo chown -R 1001:1001 ./config`.
      - ./config:/config
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Optional: dedicated cookie-signing secret (falls back to ADMIN_PASSWORD).
      - SESSION_SECRET=${SESSION_SECRET:-}
