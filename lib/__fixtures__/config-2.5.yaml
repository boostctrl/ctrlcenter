# my homelab — CtrlCenter 2.5.0
# 2.5 doesn't stamp a schemaVersion; feed cards are a `feeds` list since 2.1
settings:
  title: Rack Room
  favicon: ''
  timezone: Europe/Berlin
  theme:
    mode: system
    preset: Default
    design: glass
    scene: starfield
    font: grotesk
    accentFrom: '#f472b6'
    accentTo: '#fb923c'
  statusChecks: true
  statusInterval: 5
  statusDefaultRange: d1
  bookmarkCategoryOrder: [Media, Infra, Reading]
  groupPrivateApps: true  # private apps get their own group
  search:
    engine: brave
    customUrl: ''
    bangs:
      - key: yt
        url: 'https://www.youtube.com/results?search_query=%s'
      - key: tr
        url: 'http://tracker.lan/search?q=%s'
  weather:
    enabled: true
    latitude: 52.52
    longitude: 13.405
    units: metric
  alerts:
    enabled: true
    type: ntfy
    webhookUrl: 'http://ntfy.lan/homelab'
    webhookEnabled: true
    notifyOnRecovery: false
    confirmations: 2
    email:
      enabled: false
      host: smtp.mail.lan
      port: 587
      secure: false
      user: ''
      pass: ''
      from: rack@mail.lan
      to: ops@mail.lan
      subject: ''
  calendar:
    enabled: true
    url: 'http://radicale.lan:5232/me/calendar.ics'
    count: 5
    homeView: agenda
    hideWhenEmpty: true
    username: me
    password: fake-pass
  notes:
    title: Todo
    content: "- rotate the *arr API keys\n- order **UPS battery**"
  announcement:
    enabled: false
    message: Power work on Saturday
    tone: info
    dismissible: true
  statusAnnouncements:
    - id: 0a1b2c3d-0000-4000-8000-000000000001
      title: Proxmox upgrade
      body: All VMs reboot during the window.
      kind: maintenance
      startsAt: '2026-05-02T22:00:00.000Z'
      endsAt: '2026-05-03T01:00:00.000Z'
  # two feed cards, each placed by its own layout entry (instanceId)
  feeds:
    - id: feed
      enabled: true
      urls:
        - 'https://www.heise.de/rss/heise-atom.xml'
      count: 6
      title: Heise
      summaries: false
    - id: f-selfhosted
      enabled: true
      urls:
        - 'https://selfh.st/rss/'
        - 'https://www.reddit.com/r/selfhosted/.rss'
      count: 10
      title: Self-hosted
      summaries: true
  countdown:
    title: Countdown
    items:
      - label: Cert renewal
        date: '2026-12-01'
  worldClocks:
    title: World clocks
    items:
      - label: New York
        timeZone: America/New_York
      - label: Sydney
        timeZone: Australia/Sydney
  systemStats:
    title: System stats
    disks:
      - label: Data
        path: /data
  # Monitor dashboard connections (read-only in 2.5)
  integrations:
    qbittorrent:
      enabled: true
      url: 'http://qbit.lan:8080'
      username: admin
      password: fake-pass
      allowInsecureTls: false
    sonarr:
      enabled: true
      url: 'http://sonarr.lan:8989'
      apiKey: fake-sonarr-key
    radarr:
      enabled: true
      url: 'http://radarr.lan:7878'
      apiKey: fake-radarr-key
    adguard:  # set up but never switched on (enabled left at its default: off)
      url: 'http://adguard.lan:3000'
      username: admin
      password: fake-pass
    tautulli:
      enabled: true
      url: 'http://tautulli.lan:8181'
      apiKey: fake-tautulli-key
    seerr:
      enabled: true
      url: 'http://seerr.lan:5055'
      apiKey: fake-seerr-key
    portainer:
      enabled: true
      url: 'https://portainer.lan:9443'
      apiKey: fake-portainer-key
      allowInsecureTls: false
    truenas:
      enabled: false
      url: 'http://truenas.lan'
      apiKey: fake-truenas-key
    unifi:
      enabled: true
      url: 'https://unifi.lan:8443'
      username: readonly
      password: fake-pass
      allowInsecureTls: true
  components:
    clock: true
    settingsButton: true
  layout:
    columns: 24
    scale: 100
    gap: 32
    topGap: 64
    sections:
      - { id: greeting, span: 12 }
      - { id: clock, span: 4, hidden: false }
      - { id: weather, span: 4, hidden: false }
      - { id: status, span: 4, hidden: false }
      - { id: headerCard, span: 8, hidden: true }
      - { id: search, span: 24, hidden: false }
      - { id: feed, instanceId: feed, span: 12, hidden: false, height: 420 }
      - { id: feed, instanceId: f-selfhosted, span: 12, hidden: false, height: 420 }
      - { id: calendar, span: 8, hidden: false }
      - { id: notes, span: 8, hidden: false, hideLabel: true }
      - { id: countdown, span: 8, hidden: true }
      - { id: worldClocks, span: 8, hidden: false }
      - { id: systemStats, span: 8, hidden: false, space: { left: 8, right: 8 } }
      - { id: favorites, span: 24, hidden: true }
      - { id: apps, span: 16, hidden: false, cards: 2 }
      - { id: bookmarks, span: 8, hidden: false, cards: 1, height: 600 }
apps:
  - id: 1d6b0c2e-5a10-4c11-9f00-aa0000000001
