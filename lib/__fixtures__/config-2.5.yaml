    private: true
  - id: 1d6b0c2e-5a10-4c11-9f00-aa0000000004
    name: qBittorrent
    url: 'http://qbit.lan:8080'
    icon: qbittorrent
    checkType: tcp
    port: 8080
    private: true
  - id: 1d6b0c2e-5a10-4c11-9f00-aa0000000005
    name: Home Assistant
    subtitle: Automations
    url: 'http://ha.lan:8123'
    icon: home-assistant
    checkType: keyword
    keyword: Home Assistant
  - id: 1d6b0c2e-5a10-4c11-9f00-aa0000000006
    name: Proxmox
    url: 'https://pve.lan:8006'
    icon: proxmox
    checkType: icmp
bookmarks:
  - id: 7e8f9a0b-1111-4222-8333-bb0000000001
    category: Media
    name: Letterboxd
    url: 'https://letterboxd.com'
    icon: letterboxd
  - id: 7e8f9a0b-1111-4222-8333-bb0000000002
    category: Media
    name: Trakt
    url: 'https://trakt.tv'
  - id: 7e8f9a0b-1111-4222-8333-bb0000000003
    category: Infra
    name: Cloudflare
    url: 'https://dash.cloudflare.com'
