schemaVersion: 2
# my homelab — last saved by CtrlCenter 2.10.0
settings:
  title: Homelab
  favicon: 'http://nas.lan:5000/favicon.ico'
  timezone: America/Los_Angeles
  theme:
    mode: dark
    preset: Default
    presetLight: Default
    design: console
    scene: traces
    font: jetbrains
    designLight: minimal
    sceneLight: dots
    accentFrom: '#22c55e'
    accentTo: '#22c55e'
  statusChecks: true
  statusInterval: 1
  statusDefaultRange: h1
  bookmarkCategoryOrder: [Dev, Admin]
  groupPrivateApps: false
  search:
    engine: google
    customUrl: ''
    bangs:
      - key: npm
        url: 'https://www.npmjs.com/search?q=%s'
  weather:
    enabled: false
    latitude: 37.7749
    longitude: -122.4194
    units: imperial
  alerts:
    enabled: true
    type: slack
    webhookUrl: 'https://hooks.slack.com/services/FAKE/FAKE/fake-slack-token'
    webhookEnabled: true
    notifyOnRecovery: true
    confirmations: 1
    email:
      enabled: true
      host: smtp.mail.lan
      port: 587
      secure: false
      user: alerts
      pass: fake-pass
      from: homelab@mail.lan
      to: me@mail.lan
      subject: '{service} went {status}'
  calendar:
    enabled: true
    url: 'webcal://calendar.lan/public/family.ics'
    count: 10
    homeView: agenda
    hideWhenEmpty: false
    username: ''
    password: ''
  notes:
    title: On-call
    content: 'Pager rotation: **me** this week.'
  announcement:
    enabled: true
    message: 'New [status page](/status) is live'
    tone: success
    dismissible: false
  statusAnnouncements:
    - id: 2b3c4d5e-6f70-4812-9a3b-cc0000000001
      title: Router swap
      body: Expect a few minutes of downtime.
      kind: maintenance
      startsAt: '2026-08-20T06:00:00.000Z'
      endsAt: '2026-08-20T07:00:00.000Z'
    - id: 2b3c4d5e-6f70-4812-9a3b-cc0000000002
      title: Welcome
      body: 'Status notices show up here.'
      kind: info
      startsAt: ''
      endsAt: ''
  feeds:
    - id: feed
      enabled: true
      urls: ['https://github.blog/feed/']
      count: 5
      title: ''
      summaries: true
    - id: f-releases
      enabled: false   # parked for now
      urls:
        - 'https://github.com/immich-app/immich/releases.atom'
        - 'https://github.com/jellyfin/jellyfin/releases.atom'
        - ''
      count: 15
      title: Releases
      summaries: false
  countdown:
    title: Deadlines
    items:
      - label: Taxes
        date: '2027-04-15'
      - label: Half-typed row
        date: ''
  worldClocks:
    title: Team
    items:
      - label: Berlin
        timeZone: Europe/Berlin
      - label: Bangalore
        timeZone: Asia/Kolkata
      - label: UTC
        timeZone: UTC
  systemStats:
    title: Docker host
    disks:
      - label: Root
        path: /
      - label: Docker
        path: /var/lib/docker
  # Monitor + actions (allowActions added in 2.6)
  integrations:
    qbittorrent:
      enabled: true
      url: 'http://qbit.lan:8080'
      username: admin
      password: fake-pass
      allowInsecureTls: false
      allowActions: true
    sonarr:
      enabled: true
      url: 'http://sonarr.lan:8989'
      apiKey: fake-sonarr-key
      allowInsecureTls: false
      allowActions: false
    radarr:
      enabled: true
      url: 'http://radarr.lan:7878'
      apiKey: fake-radarr-key
    adguard:
      enabled: true
      url: 'http://adguard.lan'
      username: admin
      password: fake-pass
    tautulli:
      enabled: false
      url: ''
      apiKey: ''
    seerr:
      enabled: true
      url: 'http://seerr.lan:5055'
      apiKey: fake-seerr-key
      allowActions: true
    portainer:
      enabled: true
      url: 'https://portainer.lan:9443'
      apiKey: fake-portainer-key
      allowInsecureTls: true
      allowActions: true
    truenas:
      enabled: true
      url: 'http://truenas.lan'
      apiKey: fake-truenas-key
    unifi:
      enabled: false
      url: 'https://unifi.lan'
      username: ''
      password: ''
      allowInsecureTls: true
  # inbound *arr / Seerr webhooks, relayed through the alert channels
  webhooks:
    enabled: true
    sonarr:
      enabled: true
      token: fake-sonarr-hook-token
    radarr:
      enabled: true
      token: fake-radarr-hook-token
    seerr:
      enabled: false
      token: ''
  components:
    greeting: true
    clock: false
    search: true
    apps: true
    bookmarks: true
    favorites: true
    settingsButton: true
  layout:
    columns: 24
    scale: 110
    gap: 16
    topGap: 32
    sections:
      - { id: greeting, span: 24, height: 120, space: { top: 24 } }
      - { id: headerCard, span: 8, hidden: true }
      - { id: clock, span: 8, hidden: true }
      - { id: weather, span: 8, hidden: true }
      - { id: status, span: 24, hidden: false }
      - { id: search, span: 24, hidden: false }
      - { id: apps, span: 16, hidden: false, cards: 4, hideLabel: true }
      - { id: systemStats, span: 8, hidden: false }
      - { id: feed, instanceId: feed, span: 8, hidden: false }
      - { id: feed, instanceId: f-releases, span: 8, hidden: true }
      - { id: calendar, span: 8, hidden: false, height: 300 }
      - { id: notes, span: 8, hidden: false }
      - { id: countdown, span: 8, hidden: false }
      - { id: worldClocks, span: 8, hidden: false }
      - { id: favorites, span: 24, hidden: false, cards: 3 }
      - { id: bookmarks, span: 24, hidden: false, space: { bottom: 48 } }
